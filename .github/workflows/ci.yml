name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test
        env:
          # 위젯 스모크는 키가 없어도 MaterialApp 까지 올리지 않음.
          # 로컬 키 주입 없이도 CI가 통과하도록 더미 define 제공.
          FLUTTER_TEST: "true"
