name: hangangbus
description: '한강버스 앱'
publish_to: 'none'

version: 1.0.4+20

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  kakao_map_plugin: ^0.4.0
  shared_preferences: ^2.3.2
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  flutter_dotenv: ^6.0.1
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  url_launcher: ^6.3.2
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  bloc: ^9.2.1
  sentry_flutter: ^9.24.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.14.4"
  flutter_native_splash: ^2.4.7

flutter_launcher_icons:
  android: true
  ios: false          # iOS는 이미 정상이므로 건드리지 않는 게 안전
  image_path: "assets/icon/icon.png"   # 1024x1024 정도 원본 이미지 필요

flutter_native_splash:
  color: "#FFFFFF"               # 원하는 배경색으로 변경
  image: "assets/icon/icon.png"  # 스플래시에 띄울 이미지
  android: true
  ios: false     

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - .env